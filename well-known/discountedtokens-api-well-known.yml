method: probed
source: live probes of /.well-known/ on discountedtokens.com hosts
summary: >-
  Two real /.well-known/ documents are served on discountedtokens.com: an RFC 9727 API catalog
  (application/linkset+json, 200) and an RFC 9116 security.txt (200). That is a genuine WellKnown
  hit and the pointer is earned; the served security.txt also earns a SecurityTxt pointer. The
  provider EXPLICITLY retires the agent surfaces: /.well-known/ai-plugin.json, agent-card.json and
  agent.json all return 410 problem+json ("A2A discovery is not implemented ... this is an inference
  API, not an A2A task server"), so NO AgentCard pointer is written. No OAuth/OIDC discovery is
  served (bearer + x-api-key only).
pointer_basis: >-
  WellKnown emitted on the strength of the api-catalog and security.txt 200s. SecurityTxt emitted
  on the security.txt 200. AgentCard NOT emitted — the two agent-card paths return an honest 410
  declaring the surface unimplemented.
hosts:
