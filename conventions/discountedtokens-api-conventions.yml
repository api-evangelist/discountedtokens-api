  note: >-
    No X-RateLimit-*/RateLimit-*/Retry-After headers were returned on live unauthenticated responses
    (Cloudflare-fronted). See rate-limits/. Billing, not a request quota, is the documented governor.
request_tracing:
  documented: false
  note: No provider request-id header is documented; responses carry only Cloudflare's cf-ray.
idempotency:
  documented: false
  header: null
  coverage: none
  note: >-
    No Idempotency-Key mechanism is documented and none appears in the OpenAPI. The mutating surface
    (/chat/completions, /responses, /messages) is billed per successful request with no replay
    primitive, so a client that retries a timed-out inference call has no safe-replay guarantee and
    may be billed twice. No `Idempotency` pointer is emitted — this is a genuine zero, not a missing
    pointer.
reversibility:
  applicable: true
  grade: none
  reversal_operations: []
  note: >-
    The write surface is LLM inference (generation) plus prepaid billing. No reversal operation
    (cancel/refund/void/undo) is exposed in the API and no refund window is documented; the terms
