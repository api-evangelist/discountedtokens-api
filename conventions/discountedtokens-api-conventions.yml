summary: >-
  Cross-cutting semantics for the DiscountedTokens reseller API. It is a thin OpenAI/Anthropic-
  compatible pass-through: three inference write operations plus a model-list read, one prepaid
  Bearer key, and an OpenAI-style error envelope. No idempotency, pagination, expansion, or
  request-tracing conventions are documented, and no reversal surface exists.
authentication:
  styles: [bearer_token, api_key_header]
  bearer: 'Authorization: Bearer <prepaid-key>  (OpenAI + Responses compatible)'
  api_key_header: 'x-api-key: <prepaid-key>  (accepted on /messages, Anthropic-compatible)'
  see: authentication/discountedtokens-api-authentication.yml
client_integration:
  note: >-
    No first-party SDK is published (absent from npm and PyPI, 2026-09-17). The provider is designed
    to be called with the stock OpenAI, OpenAI Responses, or Anthropic clients by overriding the
    base URL to https://discountedtokens.com/v1. This is the documented integration path (llms.txt).
pagination:
  style: none
  note: /models returns a single unpaginated { object:"list", data:[...] } of 3 models; inference calls are not list surfaces.
